[package]
name = "codex-exe"
version = "1.0.0"
description = "CODEX.EXE - second-monitor companion for classic PC RPGs"
authors = ["Tommy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite into the app, so nothing extra has to be installed on Windows.
rusqlite = { version = "0.37", features = ["bundled"] }
# Dependency-free core (atlas builder, log tail, load orders) - unit-tested separately.
codex_core = { path = "core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
